<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#E8DFF0" />
  <title>Neha &amp; Mayank — Wedding Invitation</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    iframe { display: block; width: 100%; height: 100%; border: 0; background: #E8DFF0; }
    #load-error {
      position: fixed; inset: 0; z-index: 5; display: none; place-items: center;
      padding: 24px; text-align: center; color: #4A314D;
      background: #FDFBF9; font: 16px/1.6 system-ui, sans-serif;
    }
  </style>
</head>
<body>
  <iframe id="invitation" src="./Neha%20%26%20Mayank%20Wedding%20Invitation%20(1).html" title="Neha and Mayank wedding invitation"></iframe>
  <div id="load-error">The invitation could not be loaded. Please try again later.</div>
  <script>
    const frame = document.getElementById('invitation');
    let loadCount = 0;

    frame.addEventListener('load', () => {
      loadCount += 1;
      try {
        const cardDocument = frame.contentDocument;
        const song = cardDocument && cardDocument.getElementById('bg-music');
        if (!song) {
          document.getElementById('load-error').style.display = 'grid';
          return;
        }

        // The uploaded repository asset uses underscores; replace the stale hyphenated path.
        song.pause();
        song.src = new URL('./aaj_se_teri.mp3?v=2', window.location.href).href;
        song.load();
        song.addEventListener('error', () => {
          document.getElementById('load-error').textContent = 'The song file could not be loaded. Please check that aaj_se_teri.mp3 is present in the repository root.';
          document.getElementById('load-error').style.display = 'grid';
        }, { once: true });
      } catch (error) {
        document.getElementById('load-error').style.display = 'grid';
      }
    });

    frame.addEventListener('error', () => {
      document.getElementById('load-error').style.display = 'grid';
    });
  </script>
</body>
</html>
