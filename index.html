<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neha &amp; Mayank — Wedding Invitation</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    iframe { display: block; width: 100%; height: 100%; border: 0; }
    #start-screen { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 24px; background: rgba(54,33,57,.55); backdrop-filter: blur(5px); }
    #start-button { max-width: 340px; padding: 18px 26px; border: 1px solid #C9A875; border-radius: 999px; background: #FDFBF9; color: #4A314D; font: 600 15px/1.5 system-ui,sans-serif; box-shadow: 0 12px 36px rgba(0,0,0,.25); cursor: pointer; }
  </style>
</head>
<body>
  <iframe id="invitation" src="./index-card.html" title="Neha and Mayank wedding invitation"></iframe>
  <div id="start-screen">
    <button id="start-button" type="button">Start music &amp; open invitation</button>
  </div>
  <audio id="wedding-song" src="./aaj-se-teri.mp3" loop preload="auto"></audio>
  <script>
    const frame = document.getElementById('invitation');
    const audio = document.getElementById('wedding-song');
    const screen = document.getElementById('start-screen');
    document.getElementById('start-button').addEventListener('click', async () => {
      try {
        const cardDocument = frame.contentDocument;
        const cardAudio = cardDocument && cardDocument.getElementById('bg-music');
        if (cardAudio) cardAudio.volume = 0;
        const envelope = cardDocument && cardDocument.getElementById('envelope-stage');
        if (envelope) envelope.click();
      } catch (error) {}
      audio.volume = 0.85;
      try { await audio.play(); } catch (error) {}
      screen.remove();
    });
  </script>
</body>
</html>
